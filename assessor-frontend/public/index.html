<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e3a8a" />

  <!-- Cache Control Headers for Hostinger -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description"
    content="A comprehensive digital archiving and management system for real property records and historical data for Local Government Units." />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>Assessor Archiving System - Local Government Unit</title>
  <script>
    (function () {
      function setIcons(url) {
        if (!url) return;
        var icon = document.querySelector('link[rel="icon"]');
        if (!icon) { icon = document.createElement('link'); icon.rel = 'icon'; document.head.appendChild(icon); }
        icon.href = url;
        var apple = document.querySelector('link[rel="apple-touch-icon"]');
        if (!apple) { apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; document.head.appendChild(apple); }
        apple.href = url;
      }
      function toTitleCase(str) {
        if (!str) return '';
        return str.replace(/\w\S*/g, function (txt) {
          return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
        });
      }
      try {
        if (window.__ASSESSOR_SETTINGS__ && window.__ASSESSOR_SETTINGS__.app_logo_url) {
          setIcons(window.__ASSESSOR_SETTINGS__.app_logo_url);
        }
        if (window.__ASSESSOR_SETTINGS__ && window.__ASSESSOR_SETTINGS__.header_municipality) {
          document.title = 'Assessor Archiving System - Local Government of ' + toTitleCase(window.__ASSESSOR_SETTINGS__.header_municipality);
          return;
        }
        var base = '%REACT_APP_API_URL%';
        console.log("Title script base URL (raw):", base);
        if (base.indexOf('%REACT_APP_') === 0 || !base) {
          base = window.location.origin + '/wp-json/assessor/v1';
        }
        var settingsUrl = (base.replace(/\/$/, '')) + '/bootstrap-settings';
        console.log("Fetching settings for title from:", settingsUrl);
        fetch(settingsUrl, { credentials: 'include' }).then(function (r) {
          if (!r.ok) console.error("Settings fetch failed with status:", r.status);
          return r.ok ? r.json() : null;
        }).then(function (d) {
          console.log("Settings fetched successfully:", d);
          if (d && d.app_logo_url) setIcons(d.app_logo_url);
          if (d && d.header_municipality) {
            document.title = 'Assessor Archiving System - Local Government of ' + toTitleCase(d.header_municipality);
            console.log("Document title updated to:", document.title);
          }
        }).catch(function (err) {
          console.error("Error fetching settings:", err);
        });
      } catch (e) {
        console.error("Try-catch error in title script:", e);
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
